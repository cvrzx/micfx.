name: Build MicFX dylib

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build MicFX
        run: |
          mkdir -p native
          cp MicFX.c pitch.h build.sh native/
          bash native/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: MicFX-dylib
          path: MicFX.dylib
          if-no-files-found: error
